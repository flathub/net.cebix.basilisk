app-id: net.cebix.basilisk
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: BasiliskII
finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home

modules:
  - shared-modules/gtk2/gtk2.json

  - name: libvde
    build-options:
      cflags: -std=gnu17
    sources:
      - type: script
        commands:
          - "autoreconf -fsi"
      - type: archive
        url: https://github.com/virtualsquare/vde-2/archive/refs/tags/v2.3.3.tar.gz
        sha256: a7d2cc4c3d0c0ffe6aff7eb0029212f2b098313029126dcd12dc542723972379

  - name: BasiliskII
    buildsystem: autotools
    subdir: BasiliskII/src/Unix
    no-parallel-make: true
    config-opts:
      # VOSF crashes on Ubuntu
      - --disable-vosf
      - --with-bincue
      - --with-vdeplug
    license-files:
      - BasiliskII/COPYING
    sources:
      - type: git
        #branch: flatpak
        commit: 2d82db4c16d257ef219833b0a81d75421dd033fa
        url: https://github.com/SegHaxx/macemu-flatpak.git
