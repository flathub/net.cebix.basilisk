app-id: net.cebix.basilisk
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: BasiliskII
finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home

modules:
  - shared-modules/gtk2/gtk2.json

  # required for FPU implementation on ARM
  - name: mpfr
    only-arches:
      - arm
      - aarch64
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz
        sha256: b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01
        x-checker-data:
          type: anitya
          project-id: 2019
          url-template: https://ftp.gnu.org/gnu/mpfr/mpfr-$version.tar.xz

  - name: BasiliskII
    buildsystem: autotools
    subdir: BasiliskII/src/Unix
    no-parallel-make: true
    config-opts:
      # VOSF crashes on Ubuntu
      - --disable-vosf
    sources:
      - type: archive
        url: https://api.github.com/repos/SegHaxx/macemu-flatpak/tarball/2.8.6
        dest-filename: macemu-flatpak.tar.gz
        sha256: cc77a74153e3d29301e8343154adcca6b6a2f095dee166038253f558a759e855
        x-checker-data:
          type: json
          url: https://api.github.com/repos/SegHaxx/macemu-flatpak/releases/latest
          version-query: .tag_name
          url-query: .tarball_url
