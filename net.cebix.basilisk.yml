app-id: net.cebix.basilisk
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: BasiliskII
finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home

modules:
  - shared-modules/gtk2/gtk2.json

  # MPRF required for FPU implementation on ARM
  # Used from the runtime

  - name: BasiliskII
    buildsystem: autotools
    subdir: BasiliskII/src/Unix
    no-parallel-make: true
    config-opts:
      # VOSF crashes on Ubuntu
      - --disable-vosf
    license-files:
      - BasiliskII/COPYING
    sources:
      - type: git
        #branch: flatpak
        commit: f3295d824e863d2244b18f913586ea15880d571a
        url: https://github.com/SegHaxx/macemu-flatpak.git
